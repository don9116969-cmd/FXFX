name: FXFX 24/5 Live Portfolio Monitor

on:
  schedule:
    # Runs every 15 minutes around the clock (Mon - Fri)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write # Allows committing state back to repo

jobs:
  check-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Engine Evaluation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_PER_TRADE_USD: ${{ secrets.RISK_PER_TRADE_USD || '100.0' }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE || '10000.0' }}
        run: |
          python -u src/live_engine.py --once

      - name: Commit State Changes (if any active trade updated)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/live_portfolio_state.json ]; then
            git add data/live_portfolio_state.json
            git diff --staged --quiet || git commit -m "chore: update live portfolio state [skip ci]"
            git push origin HEAD || true
          fi
